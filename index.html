<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BearStudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">
        <span class="logo-emoji">ʕ•ᴥ•ʔ</span>
        <span class="logo-text">BearStudio</span>
      </div>
      <label class="bubble-btn small" for="fileInput" title="Agregar canciones">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </label>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden>
    </header>

    <main class="visualizer-card glass">
      <canvas id="albumArt"></canvas>
      <div class="track-info">
        <div class="track-title" id="songName">Selecciona una canción</div>
        <div class="track-sub" id="modeLabel">Modo: Barras</div>
      </div>
    </main>

    <section class="controls glass">
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input type="range" id="seekBar" class="seek" value="0" min="0" max="100" step="0.1">
        <span class="time" id="durationTime">0:00</span>
      </div>

      <div class="buttons-row">
        <button class="bubble-btn" id="prevBtn" title="Anterior">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
        </button>
        <button class="bubble-btn big" id="playBtn" title="Reproducir / Pausar">
          <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <button class="bubble-btn" id="nextBtn" title="Siguiente">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"></path></svg>
        </button>
      </div>

      <div class="secondary-row">
        <button class="bubble-btn small" id="modeBtn" title="Cambiar modo de visualización">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V14M4 10V3M12 21V12M12 8V3M20 21V16M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
        </button>

        <div class="volume-wrap glass">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"></path></svg>
          <input type="range" id="volumeBar" class="seek" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
    </section>

    <section class="playlist glass">
      <h3>Lista de reproducción</h3>
      <ul id="playlist"></ul>
    </section>
  </div>

  <audio id="audioPlayer"></audio>
  <script src="script.js"></script>
</body>
</html>
