<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WaterWaveMusic — Car</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #02030c;
      --accent:  #00dcff;
      --accent2: #7b5fff;
      --txt:     #e8f0ff;
      --dim:     rgba(232,240,255,0.45);
      --border:  rgba(0,220,255,0.22);
      --panel:   rgba(2,3,14,0.88);
      --glow:    0 0 18px rgba(0,220,255,0.65);
      --r:       14px;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--txt);
      touch-action: manipulation;
      user-select: none;
    }

    #car-viz {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    #vignette {
      position: fixed; inset: 0; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.62) 100%);
      pointer-events: none;
    }
    #scanlines {
      position: fixed; inset: 0; z-index: 2;
      background: repeating-linear-gradient(
        transparent, transparent 3px,
        rgba(0,0,0,0.025) 3px, rgba(0,0,0,0.025) 4px
      );
      pointer-events: none;
    }

    .hud {
      position: fixed; left: 0; right: 0; z-index: 10;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #top-bar {
      top: 0;
      display: flex; align-items: center; gap: 18px;
      padding: 16px 28px 24px;
      background: linear-gradient(to bottom, rgba(2,3,14,0.95) 50%, transparent);
    }
    #top-bar.hidden { opacity: 0; transform: translateY(-110%); pointer-events: none; }

    #car-logo {
      flex-shrink: 0;
      font-size: 11px; font-weight: 900;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 14px rgba(0,220,255,0.9);
    }

    #song-meta { flex: 1; min-width: 0; }

    #car-title {
      font-size: 22px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }
    #car-artist {
      margin-top: 3px;
      font-size: 13px; font-weight: 600;
      color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0.9;
    }

    #top-right { flex-shrink: 0; display: flex; align-items: center; gap: 12px; }

    #status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      font-size: 10px; letter-spacing: 0.08em; color: var(--dim);
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #444; transition: background 0.4s, box-shadow 0.4s;
    }
    #status-dot.on  { background: #00ff88; box-shadow: 0 0 8px rgba(0,255,136,0.8); }
    #status-dot.off { background: #ff6644; box-shadow: 0 0 8px rgba(255,80,40,0.6); }

    /* ── Random viz toast ── */
    #rnd-toast {
      position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
      z-index: 30;
      background: rgba(4,5,20,0.88);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 18px;
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
      color: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      white-space: nowrap;
    }

    #bottom-bar {
      bottom: 0;
      display: flex; align-items: center; gap: 20px;
      padding: 20px 28px 18px;
      background: linear-gradient(to top, rgba(2,3,14,0.95) 50%, transparent);
    }
    #bottom-bar.hidden { opacity: 0; transform: translateY(110%); pointer-events: none; }

    #transport { display: flex; align-items: center; gap: 14px; }

    .car-btn {
      display: flex; align-items: center; justify-content: center;
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(0,220,255,0.08);
      border: 1px solid var(--border);
      color: var(--txt); font-size: 18px;
      cursor: pointer; transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .car-btn:hover  { background: rgba(0,220,255,0.18); box-shadow: var(--glow); }
    .car-btn:active { transform: scale(0.88); }

    #btn-play {
      width: 66px; height: 66px; font-size: 26px;
      background: linear-gradient(145deg, var(--accent2), var(--accent));
      border: none; color: #fff;
      box-shadow: 0 0 26px rgba(0,220,255,0.5), 0 4px 16px rgba(0,0,0,0.5);
    }
    #btn-play:hover {
      background: linear-gradient(145deg, #9070ff, #00eeff);
      box-shadow: 0 0 40px rgba(0,220,255,0.75);
    }

    #viz-row { flex: 1; display: flex; gap: 8px; justify-content: center; }

    .vb {
      display: flex; align-items: center; gap: 5px;
      padding: 9px 14px; border-radius: 10px;
      background: rgba(0,220,255,0.05);
      border: 1px solid rgba(0,220,255,0.15);
      color: var(--dim); font-size: 12px;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .vb:hover  { color: var(--accent); border-color: var(--border); }
    .vb.active {
      background: rgba(0,220,255,0.14);
      border-color: var(--accent); color: var(--accent);
      box-shadow: 0 0 12px rgba(0,220,255,0.28);
    }
    /* 🎲 button pulses subtly when active */
    .vb.active.rnd-btn-vb {
      animation: rndPulse 2.4s ease-in-out infinite;
    }
    @keyframes rndPulse {
      0%,100% { box-shadow: 0 0 12px rgba(0,220,255,0.28); }
      50%      { box-shadow: 0 0 22px rgba(0,220,255,0.55); }
    }
    .vb-icon { font-size: 14px; }

    #actions { display: flex; gap: 10px; }

    .act-btn {
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; border-radius: 12px;
      background: rgba(0,220,255,0.07);
      border: 1px solid var(--border);
      color: var(--dim); font-size: 15px;
      cursor: pointer; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .act-btn:hover  { color: var(--accent); border-color: var(--accent); }
    .act-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(0,220,255,0.15); }

    #tap-hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 5; pointer-events: none; opacity: 0;
      font-size: 12px; letter-spacing: 0.12em; color: rgba(232,240,255,0.32);
      transition: opacity 0.5s;
    }

    #swipe-flash {
      position: fixed; inset: 0; z-index: 20;
      pointer-events: none; opacity: 0;
      background: rgba(0,220,255,0.06);
      transition: opacity 0.2s;
    }

    #color-strip {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(4,5,20,0.94);
      backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 60px;
      padding: 16px 22px;
      box-shadow: 0 12px 50px rgba(0,0,0,0.75);
      animation: csIn 0.22s cubic-bezier(0.32,0.72,0,1);
    }
    #color-strip.hidden { display: none; }

    @keyframes csIn {
      from { opacity: 0; transform: translate(-50%,-50%) scale(0.88); }
      to   { opacity: 1; transform: translate(-50%,-50%) scale(1);    }
    }

    .cs-dot {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .cs-dot:hover  { transform: scale(1.12); }
    .cs-dot:active { transform: scale(0.9); }
    .cs-dot.active {
      border-color: rgba(255,255,255,0.85);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 0 20px rgba(255,255,255,0.2);
      transform: scale(1.1);
    }
    .cs-dot::after {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      opacity: 0.55;
    }

    #cs-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(232,240,255,0.5);
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #cs-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
  </style>
</head>
<body>

<canvas id="car-viz"></canvas>
<div id="vignette"></div>
<div id="scanlines"></div>

<!-- Top info bar -->
<div class="hud" id="top-bar">
  <span id="car-logo">◈ WaterWave</span>
  <div id="song-meta">
    <div id="car-title">Esperando música…</div>
    <div id="car-artist">—</div>
  </div>
  <div id="top-right">
    <div id="status-pill">
      <div id="status-dot"></div>
      <span id="status-txt">Conectando</span>
    </div>
  </div>
</div>

<!-- Random viz type toast -->
<div id="rnd-toast"></div>

<!-- Bottom controls -->
<div class="hud" id="bottom-bar">
  <div id="transport">
    <button class="car-btn" id="btn-prev" title="Anterior">⏮</button>
    <button class="car-btn" id="btn-play" title="Play / Pausa">▶</button>
    <button class="car-btn" id="btn-next" title="Siguiente">⏭</button>
  </div>

  <div id="viz-row">
    <button class="vb active" data-mode="0"><span class="vb-icon">▬</span> Barras</button>
    <button class="vb"        data-mode="1"><span class="vb-icon">◉</span> Partíc</button>
    <button class="vb"        data-mode="2"><span class="vb-icon">∿</span> Onda</button>
    <button class="vb"        data-mode="3"><span class="vb-icon">○</span> Radial</button>
    <button class="vb rnd-btn-vb" data-mode="4"><span class="vb-icon">🎲</span> Rand</button>
  </div>

  <div id="actions">
    <button class="act-btn active" id="btn-info"      title="Mostrar/ocultar info">ℹ</button>
    <button class="act-btn"        id="btn-immersive" title="Modo inmersivo">⛶</button>
    <button class="act-btn"        id="btn-color"     title="Color">🎨</button>
  </div>
</div>

<!-- Color preset strip -->
<div id="color-strip" class="hidden"></div>

<div id="tap-hint">toca para mostrar controles</div>
<div id="swipe-flash"></div>

<script>
'use strict';

/* ─── Color presets ─────────────────────────────────────────── */
const CAR_PRESETS = [
  { name: 'Cian',   accent: '#00dcff', accent2: '#7b5fff', bg: '#02030c' },
  { name: 'Neon',   accent: '#00ff88', accent2: '#00aaff', bg: '#020c06' },
  { name: 'Sunset', accent: '#ff6b35', accent2: '#ff0080', bg: '#0d0203' },
  { name: 'Gold',   accent: '#ffd700', accent2: '#ff6b00', bg: '#080600' },
  { name: 'Rosa',   accent: '#ff6b9d', accent2: '#c44dff', bg: '#0d0208' },
  { name: 'Matrix', accent: '#00ff41', accent2: '#00cc88', bg: '#000800' },
];
let activeCarPreset = 0;
let stripTimer = null;

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function hexToHue(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  if (d === 0) return 0;
  let h;
  if (max === r) h = ((g-b)/d + (g<b?6:0))/6;
  else if (max === g) h = ((b-r)/d + 2)/6;
  else h = ((r-g)/d + 4)/6;
  return Math.round(h * 360);
}

let themeAccentH   = 186;
let themeAccent2H  = 258;
let themeBgRgba    = 'rgba(2,3,12,0.21)';
let themeAccentHex = '#00dcff';

function applyCarTheme(idx) {
  const p = CAR_PRESETS[idx];
  activeCarPreset = idx;
  const root = document.documentElement;
  root.style.setProperty('--accent',  p.accent);
  root.style.setProperty('--accent2', p.accent2);
  root.style.setProperty('--bg',      p.bg);
  root.style.setProperty('--border',  hexToRgba(p.accent, 0.22));
  root.style.setProperty('--glow',    `0 0 18px ${hexToRgba(p.accent, 0.65)}`);
  root.style.setProperty('--panel',   hexToRgba(p.bg, 0.88));
  document.body.style.background = p.bg;
  themeAccentH   = hexToHue(p.accent);
  themeAccent2H  = hexToHue(p.accent2);
  themeAccentHex = p.accent;
  themeBgRgba    = hexToRgba(p.bg, 0.21);
  try { localStorage.setItem('wwm-car-theme', idx); } catch(_) {}
  updateStripDots();
}

function renderColorStrip() {
  const strip = document.getElementById('color-strip');
  strip.innerHTML = '';
  CAR_PRESETS.forEach((p, i) => {
    const dot = document.createElement('button');
    dot.className = 'cs-dot' + (i === activeCarPreset ? ' active' : '');
    dot.title = p.name;
    dot.style.cssText = `background: radial-gradient(circle at 35% 35%, ${p.accent}, color-mix(in srgb, ${p.accent} 40%, ${p.accent2}));`;
    dot.addEventListener('click', () => { applyCarTheme(i); closeColorStrip(); });
    strip.appendChild(dot);
  });
  const close = document.createElement('button');
  close.id = 'cs-close';
  close.textContent = '✕';
  close.addEventListener('click', closeColorStrip);
  strip.appendChild(close);
}

function updateStripDots() {
  document.querySelectorAll('.cs-dot').forEach((d, i) =>
    d.classList.toggle('active', i === activeCarPreset));
}

function openColorStrip() {
  renderColorStrip();
  document.getElementById('color-strip').classList.remove('hidden');
  scheduleStripClose(6000);
}
function closeColorStrip() {
  document.getElementById('color-strip').classList.add('hidden');
  clearTimeout(stripTimer);
}
function scheduleStripClose(ms) {
  clearTimeout(stripTimer);
  stripTimer = setTimeout(closeColorStrip, ms);
}

(function() {
  try {
    const saved = parseInt(localStorage.getItem('wwm-car-theme') ?? '0');
    if (saved >= 0 && saved < CAR_PRESETS.length) applyCarTheme(saved);
  } catch(_) { applyCarTheme(0); }
})();

/* ─── Canvas setup ──────────────────────────────────────────── */
const canvas = document.getElementById('car-viz');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ─── DOM refs ──────────────────────────────────────────────── */
const topBar      = document.getElementById('top-bar');
const bottomBar   = document.getElementById('bottom-bar');
const carTitle    = document.getElementById('car-title');
const carArtist   = document.getElementById('car-artist');
const statusDot   = document.getElementById('status-dot');
const statusTxt   = document.getElementById('status-txt');
const tapHint     = document.getElementById('tap-hint');
const swipeFlash  = document.getElementById('swipe-flash');
const btnPlay     = document.getElementById('btn-play');
const btnPrev     = document.getElementById('btn-prev');
const btnNext     = document.getElementById('btn-next');
const btnInfo     = document.getElementById('btn-info');
const btnImmersive= document.getElementById('btn-immersive');
const btnColor    = document.getElementById('btn-color');
const rndToast    = document.getElementById('rnd-toast');
const vizBtns     = document.querySelectorAll('.vb');

/* ─── State ─────────────────────────────────────────────────── */
let vizMode   = 0;
let showInfo  = true;
let immersive = false;
let isPlaying = false;
let dataArr   = new Uint8Array(256);
let lastMsg   = 0;

/* ─── BroadcastChannel ──────────────────────────────────────── */
const ch = new BroadcastChannel('psp-car-widget');

ch.onmessage = ({ data: msg }) => {
  lastMsg = Date.now();
  statusDot.className = 'on';
  statusTxt.textContent = 'Conectado';
  switch (msg.type) {
    case 'freq':  dataArr = new Uint8Array(msg.data); break;
    case 'meta':
      carTitle.textContent  = msg.title  || '—';
      carArtist.textContent = msg.artist || '—';
      isPlaying = msg.playing;
      updatePlayBtn();
      break;
    case 'state':
      isPlaying = msg.playing;
      updatePlayBtn();
      break;
  }
};

setTimeout(() => ch.postMessage({ type: 'control', action: 'ping' }), 600);

setInterval(() => {
  if (!lastMsg) return;
  if (Date.now() - lastMsg > 3500) {
    statusDot.className = 'off';
    statusTxt.textContent = 'Sin señal';
  }
}, 1500);

function sendCtrl(action) { ch.postMessage({ type: 'control', action }); }

/* ─── Transport controls ────────────────────────────────────── */
btnPrev.addEventListener('click', () => { sendCtrl('prev'); flashSwipe(); });
btnNext.addEventListener('click', () => { sendCtrl('next'); flashSwipe(); });
btnPlay.addEventListener('click', () => {
  sendCtrl('play');
  isPlaying = !isPlaying;
  updatePlayBtn();
});
function updatePlayBtn() { btnPlay.textContent = isPlaying ? '⏸' : '▶'; }
function flashSwipe() {
  swipeFlash.style.opacity = '1';
  setTimeout(() => swipeFlash.style.opacity = '0', 200);
}

/* ─── Viz mode ──────────────────────────────────────────────── */
vizBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const newMode = parseInt(btn.dataset.mode);
    if (newMode === 4) {
      // Already in random mode → generate a new one; otherwise switch to random
      activateCarRandomViz();
      vizMode = 4;
      vizBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    } else {
      vizMode = newMode;
      vizBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  });
});

/* ─── Info / immersive / color ──────────────────────────────── */
btnInfo.addEventListener('click', () => {
  showInfo = !showInfo;
  btnInfo.classList.toggle('active', showInfo);
  applyState();
});
btnColor.addEventListener('click', () => {
  const strip = document.getElementById('color-strip');
  strip.classList.contains('hidden') ? openColorStrip() : closeColorStrip();
});
btnImmersive.addEventListener('click', toggleImmersive);
canvas.addEventListener('click', e => { if (!immersive) return; toggleImmersive(); });

function toggleImmersive() {
  immersive = !immersive;
  btnImmersive.classList.toggle('active', immersive);
  applyState();
  if (immersive) {
    tapHint.style.opacity = '1';
    setTimeout(() => tapHint.style.opacity = '0', 2800);
  }
}
function applyState() {
  if (immersive) {
    topBar.classList.add('hidden');
    bottomBar.classList.add('hidden');
  } else {
    topBar.classList.toggle('hidden', !showInfo);
    bottomBar.classList.remove('hidden');
  }
}

/* ─── Swipe gestures ────────────────────────────────────────── */
let swipeX0 = null;
document.addEventListener('touchstart', e => { swipeX0 = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (swipeX0 === null) return;
  const dx = e.changedTouches[0].clientX - swipeX0;
  swipeX0 = null;
  if (Math.abs(dx) < 60) return;
  if (dx < 0) { sendCtrl('next'); flashSwipe(); }
  else         { sendCtrl('prev'); flashSwipe(); }
});

/* ─── Particles pool ────────────────────────────────────────── */
const PCOUNT = 110;
const parts = Array.from({ length: PCOUNT }, () => ({
  x:  Math.random(),
  y:  Math.random(),
  vx: (Math.random() - 0.5) * 0.0025,
  vy: (Math.random() - 0.5) * 0.0025,
  sz: 0,
}));
const expl = Array.from({ length: 8 }, () => ({
  x: 0, y: 0, r: 0, life: 0, active: false,
}));

/* ─── Draw: Bars ────────────────────────────────────────────── */
function drawBars(W, H) {
  const N    = Math.min(dataArr.length, 128);
  const barW = W / N - 0.8;
  for (let i = 0; i < N; i++) {
    const val  = dataArr[i] / 255;
    const barH = Math.pow(val, 1.45) * H * 0.88;
    const hue  = themeAccentH + i * (64 / N);
    const alp  = 0.45 + val * 0.55;
    const x    = i * (barW + 0.8);
    const g    = ctx.createLinearGradient(0, H, 0, H - barH);
    g.addColorStop(0, `hsla(${hue},100%,55%,${alp})`);
    g.addColorStop(1, `hsla(${hue - 40},100%,82%,${alp * 0.45})`);
    ctx.fillStyle   = g;
    ctx.shadowBlur  = val > 0.62 ? 22 : 0;
    ctx.shadowColor = `hsla(${hue},100%,70%,0.9)`;
    ctx.fillRect(x, H - barH, barW, barH);
  }
  ctx.shadowBlur = 0;
}

/* ─── Draw: Particles ───────────────────────────────────────── */
function drawParticles(W, H) {
  const BOOST = 3.2;
  for (let i = 0; i < parts.length; i++) {
    const p   = parts[i];
    const val = dataArr[i % dataArr.length] / 255;
    p.sz += (val * 13 * BOOST - p.sz) * 0.4;
    const sp = 1 + val * BOOST * 0.45;
    p.x += p.vx * sp;  p.y += p.vy * sp;
    if (p.x > 1) p.x = 0; if (p.x < 0) p.x = 1;
    if (p.y > 1) p.y = 0; if (p.y < 0) p.y = 1;
    const hue   = val > 0.77 ? themeAccentH : themeAccent2H + val * 60;
    const color = `hsl(${hue},100%,${52 + val * 36}%)`;
    ctx.beginPath();
    ctx.arc(p.x * W, p.y * H, Math.max(0.4, p.sz), 0, Math.PI * 2);
    ctx.fillStyle   = color;
    ctx.shadowBlur  = val * 28;
    ctx.shadowColor = color;
    ctx.fill();
    if (val > 0.86 && Math.random() < 0.045) {
      const e = expl[Math.floor(Math.random() * expl.length)];
      if (!e.active) { e.x = p.x * W; e.y = p.y * H; e.r = 0; e.life = 1; e.active = true; }
    }
  }
  for (const e of expl) {
    if (!e.active) continue;
    e.r += 7; e.life -= 0.03;
    if (e.life <= 0) { e.active = false; continue; }
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle   = hexToRgba(themeAccentHex, e.life * 0.45);
    ctx.shadowBlur  = 45;
    ctx.shadowColor = themeAccentHex;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

/* ─── Draw: Wave ────────────────────────────────────────────── */
function drawWave(W, H) {
  const midY  = H * 0.5;
  const BOOST = 1.55;
  for (const dir of [1, -1]) {
    ctx.beginPath();
    for (let i = 0; i < dataArr.length; i++) {
      const val = Math.pow(dataArr[i] / 255, 1.55);
      const x   = (i / dataArr.length) * W;
      const y   = midY + dir * val * H * 0.44 * BOOST;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    const hue = dir > 0 ? themeAccentH : themeAccent2H;
    ctx.strokeStyle = `hsl(${hue},100%,65%)`;
    ctx.lineWidth   = 2.5;
    ctx.shadowBlur  = 18;
    ctx.shadowColor = `hsl(${hue},100%,65%)`;
    ctx.stroke();
  }
  const avg = dataArr.reduce((s, v) => s + v, 0) / dataArr.length / 255;
  ctx.beginPath();
  ctx.moveTo(0, midY); ctx.lineTo(W, midY);
  ctx.strokeStyle = hexToRgba(themeAccentHex, 0.07 + avg * 0.5);
  ctx.lineWidth   = 1;
  ctx.shadowBlur  = avg * 28;
  ctx.stroke();
  ctx.shadowBlur  = 0;
}

/* ─── Draw: Radial (car-exclusive) ──────────────────────────── */
let radAngle = 0;
function drawRadial(W, H) {
  const cx    = W * 0.5, cy = H * 0.5;
  const rBase = Math.min(W, H) * 0.26;
  const N     = Math.min(dataArr.length, 128);
  const avg   = dataArr.reduce((s, v) => s + v, 0) / N / 255;

  radAngle += 0.005;

  const pulse = rBase * (0.38 + avg * 0.45);
  const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse);
  grd.addColorStop(0,   hexToRgba(themeAccentHex, avg * 0.45));
  grd.addColorStop(0.5, `hsl(${themeAccent2H},100%,60%,${avg * 0.25})`);
  grd.addColorStop(1,   'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();

  for (let r = 1; r <= 3; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, rBase * r * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = hexToRgba(themeAccentHex, 0.05 + avg * 0.07);
    ctx.lineWidth = 1; ctx.stroke();
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(radAngle);
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2;
    const val   = dataArr[i] / 255;
    const len   = Math.pow(val, 1.3) * rBase * 1.85;
    const hue   = themeAccentH + (i / N) * 85;
    const alp   = 0.38 + val * 0.62;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * rBase,       Math.sin(angle) * rBase);
    ctx.lineTo(Math.cos(angle) * (rBase+len), Math.sin(angle) * (rBase+len));
    ctx.strokeStyle = `hsla(${hue},100%,65%,${alp})`;
    ctx.lineWidth   = 2;
    ctx.shadowBlur  = val > 0.58 ? 16 : 0;
    ctx.shadowColor = `hsla(${hue},100%,72%,0.9)`;
    ctx.stroke();
  }
  ctx.restore();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(cx, cy, 5 + avg * 6, 0, Math.PI * 2);
  ctx.fillStyle   = themeAccentHex;
  ctx.shadowBlur  = 22;
  ctx.shadowColor = themeAccentHex;
  ctx.fill();
  ctx.shadowBlur = 0;
}

/* ================================================================
   RANDOM VIZ SYSTEM (modo simple para car widget)
   ================================================================ */

const CAR_VIZ_TYPES  = ['radialRnd','tunnel','dna','starfield','polygon','orb','lissajous','grid'];
const CAR_VIZ_NAMES  = {
  radialRnd: 'Radial', tunnel: 'Túnel', dna: 'Hélice ADN',
  starfield: 'Estrellas', polygon: 'Polígono', orb: 'Orbe',
  lissajous: 'Lissajous', grid: 'Cuadrícula',
};

let carRndConfig = null;
let carRndState  = {};
let toastTimer   = null;

function crnd(a, b)    { return a + Math.random() * (b - a); }
function crndInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function carVizH(c, t) {
  // t ∈ [0,1]: interpolate from primary to secondary hue
  // if useTheme, pull from current theme colors
  const h1 = c.useTheme ? themeAccentH  : c.primaryHue;
  const h2 = c.useTheme ? themeAccent2H : c.secondaryHue;
  return (h1 + (h2 - h1) * t) % 360;
}

function generateCarRndConfig() {
  const type         = CAR_VIZ_TYPES[Math.floor(Math.random() * CAR_VIZ_TYPES.length)];
  const primaryHue   = Math.floor(Math.random() * 360);
  const secondaryHue = (primaryHue + 100 + Math.floor(Math.random() * 140)) % 360;
  const useTheme     = Math.random() > 0.35;
  const base = { type, primaryHue, secondaryHue, useTheme };

  switch (type) {
    case 'radialRnd':
      return { ...base, count: crndInt(72, 180), innerRatio: crnd(0.07, 0.18), maxRatio: crnd(0.28, 0.44), rotSpeed: (Math.random()-0.5)*0.03, mirror: Math.random()>0.5 };
    case 'tunnel':
      return { ...base, rings: crndInt(5, 14), rotSpeed: crnd(0.007, 0.026) * (Math.random()>0.5?1:-1) };
    case 'dna':
      return { ...base, freq: crnd(0.8, 2.8), amplitude: crnd(0.10, 0.28), speed: crnd(0.016, 0.055), barCount: crndInt(25, 60) };
    case 'starfield':
      return { ...base, starCount: crndInt(120, 280), speedBase: crnd(1.0, 3.6) };
    case 'polygon':
      return { ...base, sides: crndInt(3, 9), layers: crndInt(2, 5), rotSpeed: (Math.random()-0.5)*0.032, scale: crnd(0.16, 0.36) };
    case 'orb':
      return { ...base, rayCount: crndInt(40, 130), orbRadius: crnd(0.035, 0.088), rotSpeed: (Math.random()-0.5)*0.02 };
    case 'lissajous':
      return { ...base, freqX: crndInt(1, 5), freqY: crndInt(1, 5), phaseSpeed: crnd(0.004, 0.024), trailLength: crndInt(240, 600) };
    case 'grid':
      return { ...base, cols: crndInt(10, 22), rows: crndInt(6, 14), shape: Math.random()>0.5?'circle':'rect', gap: crnd(0.18, 0.34) };
  }
}

function resetCarRndState(c) {
  carRndState = { angle: 0, time: 0 };
  if (c.type === 'starfield') {
    carRndState.stars = Array.from({ length: c.starCount }, () => ({
      x: (Math.random()-0.5)*2, y: (Math.random()-0.5)*2, z: Math.random(),
    }));
  }
  if (c.type === 'lissajous') {
    carRndState.trail = [];
    carRndState.phase = Math.random() * Math.PI * 2;
  }
}

let toastHideTimer = null;
function showRndToast(name) {
  rndToast.textContent = '🎲 ' + name;
  rndToast.style.opacity = '1';
  clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(() => { rndToast.style.opacity = '0'; }, 2200);
}

function activateCarRandomViz() {
  carRndConfig = generateCarRndConfig();
  resetCarRndState(carRndConfig);
  showRndToast(CAR_VIZ_NAMES[carRndConfig.type]);
}

function drawCarRandom(W, H) {
  if (!carRndConfig) { activateCarRandomViz(); return; }
  carRndState.time += 0.016;
  const c = carRndConfig;
  switch (c.type) {
    case 'radialRnd': drawCRVizRadial(W, H, c);    break;
    case 'tunnel':    drawCRVizTunnel(W, H, c);    break;
    case 'dna':       drawCRVizDNA(W, H, c);       break;
    case 'starfield': drawCRVizStarfield(W, H, c); break;
    case 'polygon':   drawCRVizPolygon(W, H, c);   break;
    case 'orb':       drawCRVizOrb(W, H, c);       break;
    case 'lissajous': drawCRVizLissajous(W, H, c); break;
    case 'grid':      drawCRVizGrid(W, H, c);      break;
  }
}

/* ── RADIAL RANDOM ─────────────────────────────────────────── */
function drawCRVizRadial(W, H, c) {
  const cx = W/2, cy = H/2, minDim = Math.min(W,H);
  carRndState.angle += c.rotSpeed;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(carRndState.angle);
  const inner = minDim * c.innerRatio;
  const bW    = Math.max(1.5, (2*Math.PI*inner/c.count)*0.65);
  for (let i = 0; i < c.count; i++) {
    const val   = Math.pow(dataArr[Math.floor(i*dataArr.length/c.count)]  / 255, 1.35);
    const angle = (i/c.count)*Math.PI*2;
    const barH  = val * minDim * c.maxRatio;
    const hue   = carVizH(c, i/c.count);
    ctx.save();
    ctx.rotate(angle);
    ctx.fillStyle   = `hsl(${hue},100%,${50+val*38}%)`;
    ctx.shadowBlur  = val>0.5 ? 14 : 0;
    ctx.shadowColor = `hsl(${hue},100%,70%)`;
    ctx.fillRect(-bW/2, inner, bW, barH);
    if (c.mirror) ctx.fillRect(-bW/2, -(inner+barH), bW, barH);
    ctx.restore();
  }
  ctx.restore();
  ctx.shadowBlur = 0;
}

/* ── TUNNEL ────────────────────────────────────────────────── */
function drawCRVizTunnel(W, H, c) {
  const cx = W/2, cy = H/2, minDim = Math.min(W,H)*0.48;
  carRndState.angle += c.rotSpeed;
  for (let r = 0; r < c.rings; r++) {
    const t    = r/c.rings;
    const val  = dataArr[Math.floor(t*dataArr.length*0.7)] / 255;
    const rad  = minDim*(1-t)*(0.82+val*0.28);
    const hue  = carVizH(c, t);
    const alpha= 0.25+val*0.75;
    const spikes = 5+r*2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(carRndState.angle*(r%2===0?1:-1));
    ctx.beginPath();
    for (let s = 0; s < spikes; s++) {
      const a0 = (s/spikes)*Math.PI*2;
      const a1 = ((s+0.5)/spikes)*Math.PI*2;
      const sv = dataArr[Math.floor((s/spikes)*dataArr.length)] / 255;
      const rO = rad, rI = rad*(0.62-sv*0.25);
      if (s===0) ctx.moveTo(Math.cos(a0)*rO, Math.sin(a0)*rO);
      else        ctx.lineTo(Math.cos(a0)*rO, Math.sin(a0)*rO);
      ctx.lineTo(Math.cos(a1)*rI, Math.sin(a1)*rI);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue},100%,65%,${alpha})`;
    ctx.lineWidth   = 1.5+val;
    ctx.shadowBlur  = val*22;
    ctx.shadowColor = `hsl(${hue},100%,70%)`;
    ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

/* ── DNA HELIX ─────────────────────────────────────────────── */
function drawCRVizDNA(W, H, c) {
  const midY = H*0.5, t = carRndState.time;
  for (let i = 0; i < c.barCount; i++) {
    const x     = (i/c.barCount)*W;
    const val   = dataArr[Math.floor((i/c.barCount)*dataArr.length)] / 255;
    const phase = (i/c.barCount)*Math.PI*2*c.freq - t*c.speed*60;
    const amp   = H*c.amplitude*(0.5+val*0.6);
    const y1    = midY + Math.sin(phase)*amp;
    const y2    = midY + Math.sin(phase+Math.PI)*amp;
    const h1    = carVizH(c, 0), h2 = carVizH(c, 1);
    ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2);
    ctx.strokeStyle = `hsla(${(h1+h2)/2},60%,65%,${0.18+val*0.28})`;
    ctx.lineWidth = 1; ctx.shadowBlur = 0; ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y1,2+val*5.5,0,Math.PI*2);
    ctx.fillStyle   = `hsl(${h1},100%,${55+val*35}%)`;
    ctx.shadowBlur  = val*20; ctx.shadowColor = `hsl(${h1},100%,70%)`; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y2,2+val*5.5,0,Math.PI*2);
    ctx.fillStyle   = `hsl(${h2},100%,${55+val*35}%)`;
    ctx.shadowColor = `hsl(${h2},100%,70%)`; ctx.fill();
  }
  ctx.shadowBlur = 0;
}

/* ── STARFIELD ──────────────────────────────────────────────── */
function drawCRVizStarfield(W, H, c) {
  const cx = W/2, cy = H/2;
  const avg  = dataArr.reduce((s,v)=>s+v,0)/dataArr.length/255;
  const bass = dataArr[1]/255;
  for (const star of carRndState.stars) {
    star.z -= 0.004 + avg*c.speedBase*0.012;
    if (star.z <= 0) { star.x=(Math.random()-0.5)*2; star.y=(Math.random()-0.5)*2; star.z=1; }
    const sx   = (star.x/star.z)*W*0.5+cx;
    const sy   = (star.y/star.z)*H*0.5+cy;
    const size = (1-star.z)*3.5*(1+bass*2.2);
    const alpha= 1-star.z;
    const hue  = bass>0.55 ? carVizH(c,0) : carVizH(c,1);
    ctx.beginPath(); ctx.arc(sx,sy,Math.max(0.3,size),0,Math.PI*2);
    ctx.fillStyle   = `hsla(${hue},100%,${68+bass*28}%,${alpha})`;
    ctx.shadowBlur  = bass>0.5?12:0; ctx.shadowColor = `hsl(${hue},100%,80%)`;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

/* ── POLYGON ────────────────────────────────────────────────── */
function drawCRVizPolygon(W, H, c) {
  const cx = W/2, cy = H/2, minDim = Math.min(W,H)*0.5;
  carRndState.angle += c.rotSpeed;
  for (let layer = 0; layer < c.layers; layer++) {
    const t    = layer/(c.layers-1||1);
    const val  = dataArr[Math.floor(t*dataArr.length*0.8)] / 255;
    const rad  = minDim*c.scale*(0.5+t*1.1)*(0.7+val*0.55);
    const hue  = carVizH(c, t);
    const alpha= 0.35+val*0.65;
    const rot  = carRndState.angle+(layer%2===0?0:Math.PI/c.sides);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    ctx.beginPath();
    for (let s = 0; s < c.sides; s++) {
      const a  = (s/c.sides)*Math.PI*2 - Math.PI/2;
      const sv = dataArr[Math.floor((s/c.sides)*dataArr.length*0.5)] / 255;
      const r2 = rad*(0.82+sv*0.28);
      s===0 ? ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2) : ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue},100%,65%,${alpha})`;
    ctx.lineWidth   = 1.5+val*2.5; ctx.shadowBlur = val*28; ctx.shadowColor = `hsl(${hue},100%,70%)`;
    ctx.stroke(); ctx.restore();
  }
  ctx.shadowBlur = 0;
}

/* ── ORB ────────────────────────────────────────────────────── */
function drawCRVizOrb(W, H, c) {
  const cx = W/2, cy = H/2, minDim = Math.min(W,H);
  const bass  = dataArr[1]/255;
  const orbR  = minDim*c.orbRadius*(1+bass*1.6);
  const orbHue= carVizH(c, 0);
  const grad  = ctx.createRadialGradient(cx,cy,0,cx,cy,orbR*3);
  grad.addColorStop(0,   `hsl(${orbHue},100%,95%)`);
  grad.addColorStop(0.35,`hsl(${orbHue},100%,65%)`);
  grad.addColorStop(1,   `hsla(${orbHue},100%,50%,0)`);
  ctx.beginPath(); ctx.arc(cx,cy,orbR*3,0,Math.PI*2);
  ctx.fillStyle   = grad; ctx.shadowBlur=35+bass*45; ctx.shadowColor=`hsl(${orbHue},100%,70%)`;
  ctx.fill();
  carRndState.angle += c.rotSpeed;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(carRndState.angle);
  for (let i = 0; i < c.rayCount; i++) {
    const val   = Math.pow(dataArr[Math.floor(i*dataArr.length/c.rayCount)]/255, 1.25);
    const angle = (i/c.rayCount)*Math.PI*2;
    const len   = val*minDim*0.43;
    const hue   = carVizH(c, i/c.rayCount);
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle)*orbR,         Math.sin(angle)*orbR);
    ctx.lineTo(Math.cos(angle)*(orbR+len),   Math.sin(angle)*(orbR+len));
    ctx.strokeStyle = `hsl(${hue},100%,${52+val*38}%)`;
    ctx.lineWidth   = Math.max(0.5,val*2.8); ctx.shadowBlur=val>0.55?16:0; ctx.shadowColor=`hsl(${hue},100%,70%)`;
    ctx.stroke();
  }
  ctx.restore(); ctx.shadowBlur = 0;
}

/* ── LISSAJOUS ──────────────────────────────────────────────── */
function drawCRVizLissajous(W, H, c) {
  carRndState.phase += c.phaseSpeed;
  const avg = dataArr.reduce((s,v)=>s+v,0)/dataArr.length/255;
  const cx  = W/2, cy = H/2;
  const amp = Math.min(W,H)*0.38*(0.55+avg*0.65);
  const x   = cx + Math.sin(c.freqX*carRndState.phase)*amp;
  const y   = cy + Math.sin(c.freqY*carRndState.phase+Math.PI/4)*amp;
  carRndState.trail.push({ x, y, v: avg });
  if (carRndState.trail.length > c.trailLength) carRndState.trail.shift();
  const trail = carRndState.trail;
  for (let i = 1; i < trail.length; i++) {
    const p   = trail[i-1], q = trail[i];
    const t   = i/trail.length;
    const hue = carVizH(c, t);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y);
    ctx.strokeStyle = `hsla(${hue},100%,${52+q.v*38}%,${t*0.88})`;
    ctx.lineWidth   = 0.8+q.v*2.8; ctx.shadowBlur=q.v>0.6?10:0; ctx.shadowColor=`hsl(${hue},100%,70%)`;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

/* ── GRID ───────────────────────────────────────────────────── */
function drawCRVizGrid(W, H, c) {
  const gW = W/c.cols, gH = H/c.rows;
  for (let row = 0; row < c.rows; row++) {
    for (let col = 0; col < c.cols; col++) {
      const idx  = Math.floor((col/c.cols)*dataArr.length);
      const val  = Math.pow(dataArr[idx]/255, 1.2);
      const cx   = (col+0.5)*gW, cy = (row+0.5)*gH;
      const size = Math.min(gW,gH)*0.5*(c.gap+val*(1-c.gap));
      const hue  = carVizH(c, (row%2)*0.5)+col*(35/c.cols);
      ctx.fillStyle   = `hsl(${hue%360},100%,${44+val*46}%)`;
      ctx.shadowBlur  = val>0.45?14:0; ctx.shadowColor=`hsl(${hue%360},100%,70%)`;
      if (c.shape==='circle') {
        ctx.beginPath(); ctx.arc(cx,cy,Math.max(0.5,size),0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillRect(cx-size,cy-size,size*2,size*2);
      }
    }
  }
  ctx.shadowBlur = 0;
}

/* ─── Main draw loop ────────────────────────────────────────── */
function draw() {
  requestAnimationFrame(draw);
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = themeBgRgba;
  ctx.fillRect(0, 0, W, H);
  switch (vizMode) {
    case 0: drawBars(W, H);      break;
    case 1: drawParticles(W, H); break;
    case 2: drawWave(W, H);      break;
    case 3: drawRadial(W, H);    break;
    case 4: drawCarRandom(W, H); break;
  }
}

draw();
</script>
